# Shadow Watch EDR Daemon Configuration
# /etc/shadow-watch/config.conf

[monitoring]
# What processes to monitor
monitor_node_processes=true
monitor_python_processes=true  
monitor_all_processes=false

# Package managers to watch
watch_npm=true
watch_pip=true
watch_apt=true
watch_yarn=true
watch_pnpm=true

[response]
# Response actions
log_events=true
send_alerts=false
kill_on_malicious=false

# Alert thresholds
suspicious_connection_threshold=5
credential_access_threshold=1

[logging]
# Log file settings  
log_file=/var/log/shadow/watch.log
log_level=info
max_log_size=100M
rotate_logs=true

[network]
# Network monitoring
monitor_outbound_connections=true
block_known_malicious=true
alert_on_suspicious=true

[advanced]
# Advanced settings
scan_frequency=500ms
event_retention=1000
enable_static_scan=false