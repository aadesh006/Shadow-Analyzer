# Shadow Analyzer — LSM Blocklist
#
# Filenames listed here are blocked at Ring 0 via the eBPF LSM file_open hook.
# Any process inside the sandbox that attempts to open a file whose basename
# matches an entry here will receive EPERM — the file is never opened.
#
# Rules:
#   - One filename (basename only, no path) per line
#   - The LSM hook also checks that the parent directory is sensitive
#     (/etc, ~/.ssh, ~/.aws, ~/.gnupg) before consulting this list —
#     so common names like "config" won't fire on unrelated paths.
#   - Comments begin with #
#   - Blank lines are ignored

# --- Unix credential files ---
passwd
shadow
gshadow
master.passwd

# --- SSH keys and config ---
id_rsa
id_ed25519
id_ecdsa
id_dsa
id_rsa.pub
id_ed25519.pub
id_ecdsa.pub
authorized_keys
known_hosts
config

# --- AWS credentials ---
credentials
config

# --- GnuPG ---
secring.gpg
pubring.gpg
trustdb.gpg
private-keys-v1.d

# --- Generic secrets ---
.env
.env.local
.env.production
.env.development
.netrc
.npmrc
.pypirc
.gitconfig
